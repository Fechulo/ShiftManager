<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATC Shift Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0B0F1A;
  --surface: #131929;
  --surface2: #1A2235;
  --surface3: #202A42;
  --border: #25334F;
  --border2: #2E3F61;
  --accent: #FF5733;
  --accent2: #4E9EFF;
  --purple: #9D79F2;
  --green: #2ECC9A;
  --text: #E2E8F5;
  --text-muted: #60718A;
  --text-dim: #8898B5;
  --font-head: 'Bebas Neue', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --font-body: 'Mulish', sans-serif;
}

html, body { height: 100%; overflow: hidden; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
}

#root { display: flex; flex-direction: column; height: 100%; }

/* ── HEADER ── */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  height: 56px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  gap: 12px;
}

.app-logo {
  font-family: var(--font-head);
  font-size: 22px;
  letter-spacing: 2px;
  color: var(--text);
  white-space: nowrap;
}
.app-logo .accent { color: var(--accent); }

.header-center {
  display: flex;
  align-items: center;
  gap: 12px;
}

.month-label {
  font-family: var(--font-head);
  font-size: 18px;
  letter-spacing: 3px;
  color: var(--text);
  min-width: 200px;
  text-align: center;
}

.nav-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  width: 30px; height: 30px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, border-color 0.15s;
}
.nav-btn:hover { background: var(--surface3); border-color: var(--border2); }

.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

/* ── MAIN ── */
.app-main {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding: 16px 20px;
  gap: 12px;
}

.setup-banner {
  background: rgba(255,87,51,0.12);
  border: 1px solid rgba(255,87,51,0.35);
  border-radius: 8px;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  color: #FFA080;
  gap: 12px;
}

/* ── CALENDAR ── */
.calendar {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.calendar-header {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
  margin-bottom: 3px;
}

.cal-header-cell {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.5px;
  color: var(--text-muted);
  text-align: center;
  padding: 4px 0;
  text-transform: uppercase;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-template-rows: repeat(6, 1fr);
  gap: 3px;
  flex: 1;
  min-height: 0;
}

.day-cell {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 8px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  display: flex;
  flex-direction: column;
  gap: 3px;
  position: relative;
  overflow: hidden;
  min-height: 0;
}
.day-cell:hover {
  background: var(--surface2);
  border-color: var(--border2);
}
.day-cell:hover .day-add-hint { opacity: 1; }

.day-cell.other-month { opacity: 0.3; pointer-events: none; }
.day-cell.weekend { background: rgba(78,158,255,0.04); }
.day-cell.today {
  border-color: var(--accent);
  background: rgba(255,87,51,0.07);
}
.day-cell.today .day-number { color: var(--accent); }

.day-number {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  flex-shrink: 0;
}

.day-duties {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}

.duty-chip {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  background: color-mix(in srgb, var(--chip-color) 18%, transparent);
  border: 1px solid color-mix(in srgb, var(--chip-color) 45%, transparent);
  border-left: 3px solid var(--chip-color);
  border-radius: 5px;
  padding: 5px 7px;
  width: 100%;
  flex: 1;
  overflow: hidden;
}

.chip-name {
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 700;
  color: var(--chip-color);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
}

.chip-time {
  font-family: var(--font-mono);
  font-size: 12px;
  color: color-mix(in srgb, var(--chip-color) 70%, var(--text-muted));
  white-space: nowrap;
}

.chip-attrs {
  font-size: 12px;
  color: color-mix(in srgb, var(--chip-color) 60%, var(--text-muted));
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-style: italic;
}

.cycle-chip {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  background: rgba(255,255,255,0.03);
  border: 1px dashed var(--border2);
  border-radius: 5px;
  padding: 5px 7px;
  width: 100%;
  flex: 1;
  overflow: hidden;
}

.cycle-chip-label {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  white-space: nowrap;
  letter-spacing: 0.5px;
}
.cycle-chip-time {
  font-size: 8px;
  color: var(--text-muted);
  opacity: 0.8;
  display: block;
  margin-top: 1px;
}

.cycle-chip-sub {
  font-size: 11px;
  color: var(--text-muted);
  opacity: 0.7;
  white-space: nowrap;
}

.day-add-hint {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  color: var(--text-muted);
  opacity: 0;
  transition: opacity 0.15s;
}

/* ── SYNC STATUS ── */
.sync-status {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 20px;
  white-space: nowrap;
}
.sync-status.syncing { background: rgba(78,158,255,0.15); color: var(--accent2); }
.sync-status.success { background: rgba(46,204,154,0.15); color: var(--green); }
.sync-status.error   { background: rgba(255,87,51,0.15);  color: var(--accent); }

/* ── BUTTONS ── */
.btn-primary {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 7px 16px;
  border-radius: 7px;
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s, opacity 0.15s;
  white-space: nowrap;
}
.btn-primary:hover:not(:disabled) { background: #ff7252; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-synced {
  background: rgba(46,204,154,0.15);
  color: var(--green);
  border: 1px solid rgba(46,204,154,0.4);
  padding: 7px 16px;
  border-radius: 7px;
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 13px;
  cursor: default;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn-secondary {
  background: var(--surface2);
  color: var(--text-dim);
  border: 1px solid var(--border);
  padding: 7px 14px;
  border-radius: 7px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  white-space: nowrap;
}
.btn-secondary:hover { background: var(--surface3); border-color: var(--border2); }

.btn-icon {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  width: 28px; height: 28px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
  flex-shrink: 0;
}
.btn-icon:hover { background: var(--surface3); color: var(--text); }
.btn-icon.btn-danger:hover { background: rgba(255,87,51,0.2); border-color: rgba(255,87,51,0.4); color: var(--accent); }

.btn-icon-lg {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  width: 34px; height: 34px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 17px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.btn-icon-lg:hover { background: var(--surface3); color: var(--text); }

.btn-full { width: 100%; justify-content: center; }
.btn-sm { padding: 5px 10px; font-size: 12px; }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(5,9,18,0.75);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
  padding: 20px;
  backdrop-filter: blur(3px);
}

.modal-content {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 14px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}
.modal-header h2 {
  font-family: var(--font-head);
  font-size: 18px;
  letter-spacing: 1.5px;
  color: var(--text);
}
.modal-close {
  background: none; border: none;
  color: var(--text-muted);
  font-size: 22px; cursor: pointer;
  line-height: 1; padding: 0 2px;
  transition: color 0.15s;
}
.modal-close:hover { color: var(--text); }

.modal-body {
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.modal-desc {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.6;
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding-top: 4px;
}

/* ── DUTY LIST (in modal) ── */
.duty-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.duty-list-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--item-color, var(--border2));
  border-radius: 8px;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.duty-list-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.duty-list-name {
  font-weight: 700;
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.duty-list-time {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
}
.duty-list-notes {
  font-size: 12px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.duty-list-actions {
  display: flex;
  gap: 5px;
  flex-shrink: 0;
}

/* ── TYPE GRID ── */
.type-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.type-btn {
  background: color-mix(in srgb, var(--type-color) 10%, var(--surface2));
  border: 1px solid color-mix(in srgb, var(--type-color) 25%, var(--border));
  border-radius: 8px;
  padding: 10px 10px 8px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: background 0.15s, border-color 0.2s;
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 14px;
  color: var(--text);
}
.type-btn:hover {
  background: color-mix(in srgb, var(--type-color) 18%, var(--surface2));
  border-color: color-mix(in srgb, var(--type-color) 50%, transparent);
}
.type-btn.selected {
  background: color-mix(in srgb, var(--type-color) 25%, var(--surface2));
  border-color: var(--type-color);
  box-shadow: 0 0 0 1px var(--type-color);
  color: var(--type-color);
}
.type-time {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 400;
  color: var(--text-muted);
}
.type-btn.selected .type-time { color: color-mix(in srgb, var(--type-color) 80%, var(--text)); }

/* ── FORM ── */
.form-section { display: flex; flex-direction: column; gap: 5px; flex: 1; }
.form-row { display: flex; gap: 10px; }
.form-label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-muted);
}

.form-input {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text);
  padding: 8px 10px;
  font-size: 13px;
  font-family: var(--font-body);
  width: 100%;
  transition: border-color 0.15s;
  outline: none;
}
.form-input:focus { border-color: var(--accent2); }
.form-input[type="time"] { font-family: var(--font-mono); font-size: 14px; }
.form-textarea { resize: vertical; min-height: 60px; }

/* ── CHECKBOXES ── */
.checkbox-group { display: flex; gap: 12px; flex-wrap: wrap; }
.checkbox-label {
  display: flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-dim);
  padding: 7px 12px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 7px;
  transition: background 0.15s, border-color 0.15s;
  user-select: none;
}
.checkbox-label:hover { background: var(--surface3); border-color: var(--border2); }
.checkbox-label input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }
.checkbox-label:has(input:checked) {
  background: rgba(255,87,51,0.1);
  border-color: rgba(255,87,51,0.4);
  color: #FFA08A;
}

/* ── DAY NUM GRID ── */
.day-num-grid {
  display: flex;
  gap: 8px;
}
.day-num-btn {
  flex: 1;
  padding: 10px 0;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.day-num-btn:hover { background: var(--surface3); border-color: var(--border2); }
.day-num-btn.selected {
  background: rgba(78,158,255,0.15);
  border-color: var(--accent2);
  color: var(--accent2);
}

/* ── WEEKS OPTIONS ── */
.weeks-options { display: flex; gap: 8px; }
.weeks-btn {
  flex: 1;
  padding: 9px 0;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 12px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.weeks-btn:hover { background: var(--surface3); }
.weeks-btn.selected {
  background: rgba(157,121,242,0.15);
  border-color: var(--purple);
  color: var(--purple);
}

/* ── SETTINGS ── */
.settings-section {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.settings-section:last-child { border-bottom: none; padding-bottom: 0; }
.settings-heading {
  font-family: var(--font-head);
  font-size: 15px;
  letter-spacing: 1.5px;
  color: var(--text);
}
.settings-desc {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.6;
}

.duty-types-list { display: flex; flex-direction: column; gap: 5px; }
.duty-type-row {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 8px 12px;
}
.type-color-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.type-row-name { flex: 1; font-weight: 600; font-size: 13px; }
.type-row-time { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
.type-badge {
  background: rgba(61,95,192,0.25);
  border: 1px solid rgba(61,95,192,0.5);
  color: #7898F0;
  font-size: 10px;
  font-family: var(--font-mono);
  padding: 1px 6px;
  border-radius: 10px;
}

.add-type-form {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.color-picker { display: flex; gap: 6px; flex-wrap: wrap; }
.color-dot {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.15s;
}
.color-dot:hover { transform: scale(1.2); }
.color-dot.selected { border-color: #fff; transform: scale(1.15); }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* ── SETUP INSTRUCTIONS ── */
.setup-instructions {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.7;
}
.setup-instructions ol { padding-left: 18px; }
.setup-instructions code {
  background: var(--surface3);
  padding: 1px 6px;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent2);
}

/* ── CALENDAR SELECT ── */
.cal-select {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  padding: 5px 10px;
  cursor: pointer;
  outline: none;
  max-width: 180px;
  transition: border-color 0.15s;
}
.cal-select:hover { border-color: var(--border2); }
.cal-select:focus { border-color: var(--accent2); }



/* ── PROFILE TABS ── */
.profile-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 4px; }
.profile-tab-wrap { display: flex; align-items: center; }
.profile-tab {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 6px;
  padding: 5px 14px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
}
.profile-tab:hover { border-color: var(--border2); color: var(--text); }
.profile-tab.selected {
  background: color-mix(in srgb, var(--accent2) 15%, transparent);
  border-color: var(--accent2);
  color: var(--accent2);
}
.profile-delete {
  background: none; border: none; color: var(--text-muted);
  cursor: pointer; padding: 2px 6px; font-size: 14px;
  line-height: 1; border-radius: 3px;
}
.profile-delete:hover { color: var(--accent); }

/* ── TODAY BUTTON ── */
.today-btn {
  font-size: 12px;
  font-weight: 600;
  padding: 5px 14px;
  letter-spacing: 1px;
  background: var(--surface2);
  border-color: var(--border);
  color: var(--text-dim);
  width: auto;
  min-width: unset;
  height: auto;
  font-family: var(--font-body);
}
.today-btn:hover {
  background: var(--surface3);
  border-color: var(--border2);
  color: var(--text);
}
.today-btn.is-today {
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 40%, transparent);
}

/* ── NIGHT MODE RADIO ── */
.night-mode-opts { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.night-mode-opts .checkbox-label { align-items: flex-start; gap: 10px; }

<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script>
  window._gapiReady = false;
  window._gisReady  = false;
  window.gapiLoaded = function() { window._gapiReady = true; };
  window.gisLoaded  = function() { window._gisReady  = true; };
</script>
<script src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
<script src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const CYCLE_LENGTH = 9;
// 4-1-1-3 rotation: E E L L R N R R R  (R = rest, no event)
const CYCLE_SLOTS = [
  { label:'E', startTime:'06:00', endTime:'17:00', isRest:false },
  { label:'E', startTime:'06:00', endTime:'17:00', isRest:false },
  { label:'L', startTime:'13:00', endTime:'23:59', isRest:false },
  { label:'L', startTime:'13:00', endTime:'23:59', isRest:false },
  { label:'R', isRest:true },
  { label:'N', startTime:'23:00', endTime:'06:45', isRest:false },
  { label:'R', isRest:true },
  { label:'R', isRest:true },
  { label:'R', isRest:true },
];
const STORAGE_KEY            = 'atcsm';
const APP_VERSION            = 'v1.5';

// ===== DEFAULT PROFILES =====

const DATCC_DUTIES = [
  { id: 'C',   name: 'C',   startTime: '06:00', endTime: '13:45', color: '#5B7FE0', overnight: false },
  { id: 'F',   name: 'F',   startTime: '06:30', endTime: '14:15', color: '#4E9EFF', overnight: false },
  { id: 'E',   name: 'E',   startTime: '06:30', endTime: '14:45', color: '#3DCFE3', overnight: false },
  { id: 'D',   name: 'D',   startTime: '08:00', endTime: '17:00', color: '#34D399', overnight: false },
  { id: 'L',   name: 'L',   startTime: '13:00', endTime: '23:15', color: '#FF9B3D', overnight: false },
  { id: 'K',   name: 'K',   startTime: '14:00', endTime: '23:59', color: '#F87171', overnight: false },
  { id: 'N',   name: 'N',   startTime: '23:00', endTime: '06:45', color: '#9D79F2', overnight: true  },
  { id: 'AD',  name: 'AD',  startTime: '09:15', endTime: '17:30', color: '#FBBF24', overnight: false },
  { id: 'OC1', name: 'OC1', startTime: '22:00', endTime: '07:00', color: '#9D79F2', overnight: true  },
  { id: 'OC2', name: 'OC2', startTime: '06:00', endTime: '18:00', color: '#34D399', overnight: false },
  { id: 'OC3', name: 'OC3', startTime: '12:00', endTime: '23:59', color: '#FF9B3D', overnight: false },
];
// Attribute definition: { id, name, hasFreeText, freeTextLabel? }
const DATCC_ATTRS = [
  { id: 'ot',      name: 'OT',      hasFreeText: false },
  { id: 'flexi',   name: 'Flexi',   hasFreeText: false },
  { id: 'comp',    name: 'Comp',    hasFreeText: false },
  { id: 'swapped', name: 'Swap', hasFreeText: true, freeTextLabel: 'Swapped with' },
  { id: 'uca',     name: 'UCA',     hasFreeText: false },
];

const DEFAULT_PROFILES = [
  { id: 'datcc',   name: 'DATCC',   dutyTypes: DATCC_DUTIES,  attributes: DATCC_ATTRS },
];

// ===== UTILITIES =====

const uid        = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
const fmtDate    = d => { const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; };
const parseLocalDate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays    = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
const isOvernightTimes = (s, e) => { const t = x => { const [h,m] = x.split(':').map(Number); return h*60+m; }; return t(s) > t(e); };

// Migrate a duty from old field-based format to new attrs dict format
const migrateDuty = d => {
  if (d.attrs !== undefined) return d;
  const attrs = {};
  if (d.isOvertime) attrs.ot      = true;
  if (d.isFlexi)    attrs.flexi   = true;
  if (d.isSwapped)  attrs.swapped = d.swappedWith || '';
  if (d.isUCA)      attrs.uca     = true;
  const { isOvertime, isFlexi, isSwapped, swappedWith, isUCA, ...rest } = d;
  return { ...rest, attrs, notes: d.notes || '' };
};

// Build display bits for a duty: attribute labels + notes
const buildAttrBits = (duty, attributes) => {
  const bits = [];
  for (const attr of (attributes || [])) {
    const val = duty.attrs?.[attr.id];
    if (!val && val !== '') continue;
    if (attr.hasFreeText && typeof val === 'string' && val.trim()) bits.push(`${attr.name}: ${val}`);
    else if (attr.hasFreeText && !val) continue;
    else bits.push(attr.name);
  }
  if (duty.notes?.trim()) bits.push(duty.notes.trim());
  return bits;
};

// Build Google Calendar event title
const buildTitle = (duty, dutyTypes, attributes) => {
  const type = dutyTypes.find(t => t.id === duty.typeId);
  const name = type ? type.name : (duty.customName || 'Custom');
  const attrs = buildAttrBits(duty, attributes);
  return attrs.length ? `${name} (${attrs.join(', ')})` : name;
};

// Parse a GCal event back into a duty (best-effort)
const parseEventToDuty = (event, dutyTypes, attributes, nightMode) => {
  const summary = event.summary || '';
  const parenMatch = summary.match(/^(.+?)(?:\s*\((.+)\))?$/);
  const typeName = parenMatch ? parenMatch[1].trim() : summary;
  const attrStr  = parenMatch ? (parenMatch[2] || '') : '';
  const type = dutyTypes.find(t => t.name === typeName);

  const startDT = event.start?.dateTime;
  const endDT   = event.end?.dateTime;
  if (!startDT || !endDT) return null;

  const startTime = startDT.slice(11, 16);
  const endTime   = endDT.slice(11, 16);
  const startDate = startDT.slice(0, 10);
  const endDate   = endDT.slice(0, 10);
  const overnight = startDate !== endDate;
  const date = overnight ? (nightMode === 'startDate' ? startDate : endDate) : startDate;

  // Parse attrs from title parens
  const parts = attrStr ? attrStr.split(',').map(s => s.trim()).filter(Boolean) : [];
  const attrs = {};
  const unmatchedParts = [];
  for (const part of parts) {
    let matched = false;
    for (const attr of (attributes || [])) {
      if (attr.hasFreeText && part.startsWith(attr.name + ':')) {
        attrs[attr.id] = part.slice(attr.name.length + 1).trim();
        matched = true; break;
      } else if (!attr.hasFreeText && part === attr.name) {
        attrs[attr.id] = true;
        matched = true; break;
      }
    }
    if (!matched) unmatchedParts.push(part);
  }

  return {
    id: uid(), date,
    typeId: type ? type.id : null,
    customName: type ? '' : typeName,
    startTime, endTime, overnight,
    attrs,
    notes: unmatchedParts.join(', ') || (event.description || ''),
    synced: true,
    googleEventId: event.id,
  };
};

// Reconcile local duties against Google Calendar events
async function reconcileCalendar(calId, duties, nightMode, dutyTypes, attributes) {
  try {
    const timeMin = new Date(Date.now() - 90 * 86400000).toISOString();
    const timeMax = new Date(Date.now() + 400 * 86400000).toISOString();
    let allEvents = [], pageToken = null;
    do {
      const params = { calendarId: calId, timeMin, timeMax, singleEvents: true, maxResults: 250,
        privateExtendedProperty: 'source=atcsm' };
      if (pageToken) params.pageToken = pageToken;
      const resp = await gapi.client.calendar.events.list(params);
      allEvents = allEvents.concat(resp.result.items || []);
      pageToken = resp.result.nextPageToken || null;
    } while (pageToken);

    const eventMap = {};
    allEvents.forEach(e => { eventMap[e.id] = e; });

    let updated = duties.map(d => {
      if (d.googleEventId && !eventMap[d.googleEventId])
        return { ...d, synced: false, googleEventId: null };
      return d;
    });

    const localIds = new Set(duties.map(d => d.googleEventId).filter(Boolean));
    const imported = allEvents
      .filter(e => e.start?.dateTime && !localIds.has(e.id))
      .map(e => parseEventToDuty(e, dutyTypes, attributes, nightMode))
      .filter(Boolean);

    return [...updated, ...imported];
  } catch (err) { console.error('Reconcile failed:', err); return duties; }
}

const getCycleSlotForDate = (dateStr, cycleConfig) => {
  if (!cycleConfig) return null;
  const { startDate, startSlot } = cycleConfig;
  const diffDays = Math.round((parseLocalDate(dateStr) - parseLocalDate(startDate)) / 86400000);
  const pos = ((diffDays + startSlot) % CYCLE_LENGTH + CYCLE_LENGTH) % CYCLE_LENGTH;
  return CYCLE_SLOTS[pos];
};

// ===== STORAGE =====

// Only non-duty settings are persisted locally (duties live in Google Calendar)
const loadSettings = () => { try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : null; } catch { return null; } };
const saveSettings = d => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch {} };

// ===== GOOGLE API =====

const waitForGAPI = () => new Promise((resolve, reject) => {
  const t = setTimeout(() => reject(new Error('Google API load timeout')), 12000);
  const check = setInterval(() => {
    if (window._gapiReady && window._gisReady) { clearInterval(check); clearTimeout(t); resolve(); }
  }, 100);
});

// ===== MODAL =====

function Modal({ title, onClose, children, width = '500px' }) {
  useEffect(() => {
    const h = e => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', h);
    return () => document.removeEventListener('keydown', h);
  }, [onClose]);
  return (
    <div className="modal-overlay" onMouseDown={onClose}>
      <div className="modal-content" style={{ maxWidth: width }} onMouseDown={e => e.stopPropagation()}>
        <div className="modal-header">
          <h2>{title}</h2>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>
        {children}
      </div>
    </div>
  );
}

// ===== DUTY MODAL =====

function DutyModal({ date, existingDuty, dutyTypes, attributes, onSave, onDelete, onClose }) {
  const isEdit = !!existingDuty;

  const BLANK = { typeId: null, customName: '', startTime: '', endTime: '', attrs: {}, notes: '' };

  const [form, setForm] = useState(isEdit ? {
    typeId:     existingDuty.typeId || 'custom',
    customName: existingDuty.customName || '',
    startTime:  existingDuty.startTime,
    endTime:    existingDuty.endTime,
    attrs:      { ...(existingDuty.attrs || {}) },
    notes:      existingDuty.notes || '',
  } : BLANK);

  const up = patch => setForm(f => ({ ...f, ...patch }));
  const setAttr = (id, val) => up({ attrs: { ...form.attrs, [id]: val } });

  const displayDate = parseLocalDate(date).toLocaleDateString('en-GB', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
  });

  const buildDuty = (f, baseId) => {
    const type = dutyTypes.find(t => t.id === f.typeId);
    const overnight = f.typeId === 'custom'
      ? isOvernightTimes(f.startTime, f.endTime)
      : (type?.overnight || false);
    return {
      id: baseId || uid(), date,
      typeId:     f.typeId === 'custom' ? null : f.typeId,
      customName: f.typeId === 'custom' ? f.customName : '',
      startTime: f.startTime, endTime: f.endTime,
      overnight, attrs: f.attrs, notes: f.notes,
      synced: false, googleEventId: existingDuty?.googleEventId || null,
    };
  };

  const handleTypeClick = type => {
    if (!isEdit) {
      onSave(buildDuty({ ...BLANK, typeId: type.id, startTime: type.startTime, endTime: type.endTime }, uid()));
      onClose();
    } else {
      up({ typeId: type.id, startTime: type.startTime, endTime: type.endTime });
    }
  };

  const handleSave = () => {
    if (!form.typeId) return;
    if (form.typeId === 'custom' && !form.customName.trim()) return;
    onSave(buildDuty(form, existingDuty?.id));
    onClose();
  };

  const canSave   = form.typeId && form.startTime && form.endTime && (form.typeId !== 'custom' || form.customName.trim());
  const showFull  = isEdit || form.typeId === 'custom';

  return (
    <Modal title={displayDate} onClose={onClose} width="480px">
      <div className="modal-body">
        {!isEdit && !form.typeId && <p className="modal-desc">Select a duty type — standard duties are saved instantly.</p>}

        <div className="form-section">
          {showFull && <label className="form-label">Duty Type</label>}
          <div className="type-grid">
            {dutyTypes.map(type => (
              <button key={type.id} className={`type-btn ${form.typeId===type.id?'selected':''}`}
                style={{ '--type-color': type.color }} onClick={() => handleTypeClick(type)}>
                {type.name}<span className="type-time">{type.startTime}–{type.endTime}</span>
              </button>
            ))}
            <button className={`type-btn ${form.typeId==='custom'?'selected':''}`}
              style={{ '--type-color': '#2ECC9A' }}
              onClick={() => up({ typeId:'custom', startTime: form.startTime||'09:00', endTime: form.endTime||'17:00' })}>
              Custom<span className="type-time">Set times</span>
            </button>
          </div>
        </div>

        {showFull && form.typeId && (
          <>
            {form.typeId === 'custom' && (
              <div className="form-section">
                <label className="form-label">Duty Name</label>
                <input className="form-input" type="text" placeholder="e.g. Training, Standby…"
                  value={form.customName} onChange={e => up({ customName: e.target.value })} autoFocus />
              </div>
            )}

            <div className="form-row">
              <div className="form-section">
                <label className="form-label">Start Time</label>
                <input className="form-input" type="time" value={form.startTime} onChange={e => up({ startTime: e.target.value })} />
              </div>
              <div className="form-section">
                <label className="form-label">End Time</label>
                <input className="form-input" type="time" value={form.endTime} onChange={e => up({ endTime: e.target.value })} />
              </div>
            </div>

            {attributes.length > 0 && (
              <div className="form-section">
                <label className="form-label">Attributes</label>
                <div className="checkbox-group">
                  {attributes.map(attr => {
                    const val = form.attrs[attr.id];
                    const checked = attr.hasFreeText ? (val !== undefined && val !== false) : !!val;
                    return (
                      <label key={attr.id} className="checkbox-label">
                        <input type="checkbox" checked={checked}
                          onChange={e => setAttr(attr.id, e.target.checked ? (attr.hasFreeText ? '' : true) : false)} />
                        <span>{attr.name}</span>
                      </label>
                    );
                  })}
                </div>
                {attributes.filter(a => a.hasFreeText).map(attr => {
                  const val = form.attrs[attr.id];
                  if (val === false || val === undefined) return null;
                  return (
                    <input key={attr.id} className="form-input" style={{ marginTop:'8px' }} type="text"
                      placeholder={attr.freeTextLabel || attr.name}
                      value={typeof val === 'string' ? val : ''}
                      onChange={e => setAttr(attr.id, e.target.value)} />
                  );
                })}
              </div>
            )}

            <div className="form-section">
              <label className="form-label">Notes</label>
              <textarea className="form-input form-textarea" placeholder="Any additional information…"
                value={form.notes} onChange={e => up({ notes: e.target.value })} />
            </div>

            <div className="modal-footer">
              {isEdit && (
                <button className="btn-icon btn-danger"
                  style={{ marginRight:'auto', width:'auto', padding:'6px 12px', fontSize:'13px' }}
                  onClick={() => { onDelete(existingDuty.id); onClose(); }}>Delete</button>
              )}
              <button className="btn-secondary" onClick={onClose}>Cancel</button>
              <button className="btn-primary" onClick={handleSave} disabled={!canSave}>Save</button>
            </div>
          </>
        )}
      </div>
    </Modal>
  );
}

// ===== CYCLE MODAL =====

function CycleModal({ onGenerate, onClose }) {
  const [startDate, setStartDate] = useState(fmtDate(addDays(new Date(), 1)));
  const [startSlot, setStartSlot] = useState(0); // 0-based index into CYCLE_SLOTS
  const [busy, setBusy] = useState(false);
  const handle = async () => { setBusy(true); await onGenerate({ startDate, startSlot }); setBusy(false); };
  return (
    <Modal title="Generate Shift Cycle" onClose={onClose} width="440px">
      <div className="modal-body">
        <p className="modal-desc">
          Creates recurring placeholder duties in Google Calendar for the 4-1-1-3 rotation.
          Placeholders are deleted individually once the actual roster is published.
        </p>
        <div className="form-section">
          <label className="form-label">A date in the next cycle</label>
          <input className="form-input" type="date" value={startDate} onChange={e => setStartDate(e.target.value)} />
        </div>
        <div className="form-section">
          <label className="form-label">Which slot does that date fall on?</label>
          <div className="day-num-grid" style={{ gridTemplateColumns: 'repeat(9, 1fr)' }}>
            {CYCLE_SLOTS.map((slot, i) => (
              <button key={i} className={`day-num-btn ${startSlot===i?'selected':''} ${slot.isRest?'rest-slot':''}`}
                onClick={() => setStartSlot(i)}>
                {slot.label}
              </button>
            ))}
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn-secondary" onClick={onClose}>Cancel</button>
          <button className="btn-primary" onClick={handle} disabled={busy}>{busy?'Creating events…':'Generate in Calendar'}</button>
        </div>
      </div>
    </Modal>
  );
}

// ===== SETTINGS MODAL =====

const PALETTE = ['#FF9B3D','#4E9EFF','#9D79F2','#5B7FE0','#2ECC9A','#F87171','#FBBF24','#60A5FA','#FB7185','#34D399'];

// ── Profile Edit (sub-modal) ──
function ProfileEditModal({ profile, canDelete, onSave, onDelete, onClose }) {
  const [name,       setName]       = useState(profile.name);
  const [dutyTypes,  setDutyTypes]  = useState([...profile.dutyTypes]);
  const [attributes, setAttributes] = useState([...(profile.attributes||[])]);
  const [showAddType, setShowAddType] = useState(false);
  const [showAddAttr, setShowAddAttr] = useState(false);
  const [confirmDel,  setConfirmDel] = useState(false);
  const [newT, setNewT] = useState({ name:'', startTime:'09:00', endTime:'17:00', color:'#4E9EFF' });
  const [newA, setNewA] = useState({ name:'', hasFreeText:false, freeTextLabel:'' });
  const upNewT = p => setNewT(f => ({ ...f, ...p }));
  const upNewA = p => setNewA(f => ({ ...f, ...p }));

  const addType = () => {
    if (!newT.name.trim()) return;
    const overnight = isOvernightTimes(newT.startTime, newT.endTime);
    setDutyTypes(prev => [...prev, { ...newT, overnight, id: uid() }]);
    setNewT({ name:'', startTime:'09:00', endTime:'17:00', color:'#4E9EFF' });
    setShowAddType(false);
  };

  const addAttr = () => {
    if (!newA.name.trim()) return;
    const attr = { id: uid(), name: newA.name.trim(), hasFreeText: newA.hasFreeText };
    if (newA.hasFreeText && newA.freeTextLabel.trim()) attr.freeTextLabel = newA.freeTextLabel.trim();
    setAttributes(prev => [...prev, attr]);
    setNewA({ name:'', hasFreeText:false, freeTextLabel:'' });
    setShowAddAttr(false);
  };

  return (
    <Modal title={`Edit Profile — ${profile.name}`} onClose={onClose} width="600px">
      <div className="modal-body">

        {/* NAME */}
        <div className="settings-section">
          <h3 className="settings-heading">Profile Name</h3>
          <input className="form-input" type="text" value={name} onChange={e => setName(e.target.value)} />
        </div>

        {/* DUTY TYPES */}
        <div className="settings-section">
          <h3 className="settings-heading">Duty Types</h3>
          <div className="duty-types-list">
            {dutyTypes.map(t => (
              <div key={t.id} className="duty-type-row">
                <span className="type-color-dot" style={{ background: t.color }} />
                <span className="type-row-name">{t.name}</span>
                <span className="type-row-time">{t.startTime} – {t.endTime}</span>
                {t.overnight && <span className="type-badge">overnight</span>}
                <button className="btn-icon btn-danger"
                  onClick={() => setDutyTypes(prev => prev.filter(x => x.id !== t.id))}>×</button>
              </div>
            ))}
          </div>
          {showAddType ? (
            <div className="add-type-form">
              <div className="form-row">
                <div className="form-section" style={{ flex:2 }}>
                  <label className="form-label">Name</label>
                  <input className="form-input" type="text" placeholder="e.g. Standby"
                    value={newT.name} onChange={e => upNewT({ name: e.target.value })} autoFocus />
                </div>
                <div className="form-section">
                  <label className="form-label">Start</label>
                  <input className="form-input" type="time" value={newT.startTime} onChange={e => upNewT({ startTime: e.target.value })} />
                </div>
                <div className="form-section">
                  <label className="form-label">End</label>
                  <input className="form-input" type="time" value={newT.endTime} onChange={e => upNewT({ endTime: e.target.value })} />
                </div>
              </div>
              <div className="form-row" style={{ alignItems:'flex-end', gap:'14px' }}>
                <div className="form-section">
                  <label className="form-label">Colour</label>
                  <div className="color-picker">
                    {PALETTE.map(c => (
                      <button key={c} className={`color-dot ${newT.color===c?'selected':''}`}
                        style={{ background:c }} onClick={() => upNewT({ color:c })} />
                    ))}
                  </div>
                </div>

              </div>
              <div className="modal-footer" style={{ marginTop:0 }}>
                <button className="btn-secondary" onClick={() => setShowAddType(false)}>Cancel</button>
                <button className="btn-primary" onClick={addType}>Add Type</button>
              </div>
            </div>
          ) : (
            <button className="btn-secondary btn-full" onClick={() => setShowAddType(true)}>+ Add Duty Type</button>
          )}
        </div>

        {/* ATTRIBUTES */}
        <div className="settings-section">
          <h3 className="settings-heading">Attributes</h3>
          <div className="duty-types-list">
            {attributes.map(a => (
              <div key={a.id} className="duty-type-row">
                <span className="type-row-name">{a.name}</span>
                {a.hasFreeText && <span className="type-badge">free text{a.freeTextLabel ? ` — ${a.freeTextLabel}` : ''}</span>}
                <button className="btn-icon btn-danger"
                  onClick={() => setAttributes(prev => prev.filter(x => x.id !== a.id))}>×</button>
              </div>
            ))}
          </div>
          {showAddAttr ? (
            <div className="add-type-form">
              <div className="form-row">
                <div className="form-section" style={{ flex:2 }}>
                  <label className="form-label">Name</label>
                  <input className="form-input" type="text" placeholder="e.g. UCA"
                    value={newA.name} onChange={e => upNewA({ name: e.target.value })} autoFocus />
                </div>
                <div className="form-section" style={{ justifyContent:'flex-end', paddingBottom:'4px' }}>
                  <label className="checkbox-label">
                    <input type="checkbox" checked={newA.hasFreeText} onChange={e => upNewA({ hasFreeText: e.target.checked })} />
                    <span>Free text</span>
                  </label>
                </div>
              </div>
              {newA.hasFreeText && (
                <div className="form-section">
                  <label className="form-label">Field label (optional)</label>
                  <input className="form-input" type="text" placeholder="e.g. Swapped with"
                    value={newA.freeTextLabel} onChange={e => upNewA({ freeTextLabel: e.target.value })} />
                </div>
              )}
              <div className="modal-footer" style={{ marginTop:0 }}>
                <button className="btn-secondary" onClick={() => setShowAddAttr(false)}>Cancel</button>
                <button className="btn-primary" onClick={addAttr}>Add Attribute</button>
              </div>
            </div>
          ) : (
            <button className="btn-secondary btn-full" onClick={() => setShowAddAttr(true)}>+ Add Attribute</button>
          )}
        </div>

        {/* DANGER ZONE */}
        {canDelete && (
          <div className="settings-section">
            <h3 className="settings-heading" style={{ color:'var(--accent)' }}>Danger Zone</h3>
            {confirmDel ? (
              <div style={{ display:'flex', alignItems:'center', gap:'10px' }}>
                <span style={{ fontSize:'13px', color:'var(--text-dim)' }}>Delete this profile?</span>
                <button className="btn-danger-outline" onClick={onDelete}>Yes, delete</button>
                <button className="btn-secondary" onClick={() => setConfirmDel(false)}>Cancel</button>
              </div>
            ) : (
              <button className="btn-danger-outline" onClick={() => setConfirmDel(true)}>Delete Profile</button>
            )}
          </div>
        )}

        <div className="modal-footer">
          <button className="btn-secondary" onClick={onClose}>Cancel</button>
          <button className="btn-primary"
            onClick={() => { onSave({ ...profile, name: name.trim() || profile.name, dutyTypes, attributes }); onClose(); }}>
            Save Profile
          </button>
        </div>
      </div>
    </Modal>
  );
}

// ── Main Settings ──
function SettingsModal({ profiles, activeProfileId, nightMode, clientId, onSave, onClose }) {
  const [localProfiles,  setLocalProfiles]  = useState(profiles.map(p => ({ ...p, dutyTypes:[...p.dutyTypes], attributes:[...(p.attributes||[])] })));
  const [localActiveId,  setLocalActiveId]  = useState(activeProfileId);
  const [localNightMode, setLocalNightMode] = useState(nightMode);
  const [cid,            setCid]            = useState(clientId);
  const [editingProfile, setEditingProfile] = useState(null); // profile object being edited
  const [addingProfile,  setAddingProfile]  = useState(false);
  const [newProfileName, setNewProfileName] = useState('');

  const addProfile = () => {
    if (!newProfileName.trim()) return;
    const p = { id: uid(), name: newProfileName.trim(), dutyTypes:[], attributes:[] };
    setLocalProfiles(prev => [...prev, p]);
    setLocalActiveId(p.id);
    setNewProfileName('');
    setAddingProfile(false);
    setEditingProfile(p); // immediately open editor for the new profile
  };

  const handleSaveProfile = updated => {
    setLocalProfiles(prev => prev.map(p => p.id === updated.id ? updated : p));
  };

  const handleDeleteProfile = id => {
    const remaining = localProfiles.filter(p => p.id !== id);
    setLocalProfiles(remaining);
    if (localActiveId === id) setLocalActiveId(remaining[0]?.id);
    setEditingProfile(null);
  };

  // If editing a profile, show that modal on top
  if (editingProfile) {
    const current = localProfiles.find(p => p.id === editingProfile.id) || editingProfile;
    return (
      <ProfileEditModal
        profile={current}
        canDelete={localProfiles.length > 1}
        onSave={handleSaveProfile}
        onDelete={() => handleDeleteProfile(current.id)}
        onClose={() => setEditingProfile(null)}
      />
    );
  }

  const activeProfile = localProfiles.find(p => p.id === localActiveId) || localProfiles[0];

  return (
    <Modal title="Settings" onClose={onClose} width="520px">
      <div className="modal-body">

        {/* PROFILE */}
        <div className="settings-section">
          <h3 className="settings-heading">Profile</h3>
          <div className="profile-select-row">
            <select className="form-input profile-select" value={localActiveId}
              onChange={e => setLocalActiveId(e.target.value)}>
              {localProfiles.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
            <button className="btn-secondary" onClick={() => setEditingProfile(activeProfile)}>Edit Profile</button>
          </div>
          {addingProfile ? (
            <div style={{ display:'flex', gap:'8px', alignItems:'center', marginTop:'10px' }}>
              <input className="form-input" style={{ flex:1 }} placeholder="New profile name" autoFocus
                value={newProfileName} onChange={e => setNewProfileName(e.target.value)}
                onKeyDown={e => e.key==='Enter' && addProfile()} />
              <button className="btn-primary" onClick={addProfile}>Add</button>
              <button className="btn-secondary" onClick={() => setAddingProfile(false)}>Cancel</button>
            </div>
          ) : (
            <button className="btn-secondary btn-full" style={{ marginTop:'10px' }}
              onClick={() => setAddingProfile(true)}>+ New Profile</button>
          )}
        </div>

        {/* NIGHT DUTY CONVENTION */}
        <div className="settings-section">
          <h3 className="settings-heading">Night Duty Convention</h3>
          <p className="settings-desc">When an overnight duty is shown on a date:</p>
          <div className="night-mode-opts">
            {[
              ['endDate',   'Duty <strong>ends</strong> on the <strong>morning</strong> of the date shown'],
              ['startDate', 'Duty <strong>starts</strong> on the <strong>night</strong> of the date shown'],
            ].map(([val, label]) => (
              <label key={val} className="checkbox-label">
                <input type="radio" name="nightMode" checked={localNightMode===val} onChange={() => setLocalNightMode(val)} />
                <span>{label}</span>
              </label>
            ))}
          </div>
        </div>

        {/* GOOGLE CALENDAR */}
        <div className="settings-section">
          <h3 className="settings-heading">Google Calendar — OAuth Setup</h3>
          <div className="setup-instructions">
            <ol>
              <li>Go to <strong>console.cloud.google.com</strong> → APIs &amp; Services → Library</li>
              <li>Enable the <strong>Google Calendar API</strong></li>
              <li>Go to <strong>Credentials</strong> → Create Credentials → OAuth 2.0 Client ID</li>
              <li>Application type: <strong>Web application</strong></li>
              <li>Add your site URL as an <strong>Authorised JavaScript origin</strong></li>
              <li>Copy the Client ID below</li>
            </ol>
          </div>
          <div className="form-section">
            <label className="form-label">Client ID</label>
            <input className="form-input" type="text" placeholder="xxxxxxxxxx.apps.googleusercontent.com"
              value={cid} onChange={e => setCid(e.target.value)} />
          </div>
        </div>

        <div className="modal-footer">
          <button className="btn-secondary" onClick={onClose}>Cancel</button>
          <button className="btn-primary" onClick={() => onSave({
            profiles: localProfiles, activeProfileId: localActiveId,
            nightMode: localNightMode, clientId: cid
          })}>Save Settings</button>
        </div>
      </div>
    </Modal>
  );
}

// ===== CALENDAR GRID =====

function CalendarGrid({ year, month, duties, dutyTypes, attributes, cycleConfig, nightMode, todayStr, onDayClick }) {
  const daysInMonth    = new Date(year, month+1, 0).getDate();
  const firstDOW       = (new Date(year, month, 1).getDay() + 6) % 7;
  const prevMonthTotal = new Date(year, month, 0).getDate();
  const cells = [];
  for (let i = firstDOW-1; i >= 0; i--)
    cells.push({ date: fmtDate(new Date(year, month-1, prevMonthTotal-i)), cur: false });
  for (let d = 1; d <= daysInMonth; d++)
    cells.push({ date: fmtDate(new Date(year, month, d)), cur: true });
  while (cells.length < 42)
    cells.push({ date: fmtDate(new Date(year, month+1, cells.length-daysInMonth-firstDOW+1)), cur: false });

  return (
    <div className="calendar">
      <div className="calendar-header">
        {['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => <div key={d} className="cal-header-cell">{d}</div>)}
      </div>
      <div className="calendar-grid">
        {cells.map(({ date, cur }) => {
          const duty    = duties.find(d => d.date === date) || null;
          const dow     = parseLocalDate(date).getDay();
          const weekend = dow === 0 || dow === 6;
          const type    = duty ? dutyTypes.find(t => t.id === duty.typeId) : null;
          const color   = type?.color || '#2ECC9A';
          const attrBits = duty ? buildAttrBits(duty, attributes) : [];
          const overnightTag = duty?.overnight ? (nightMode==='startDate' ? ' →+1' : ' ←-1') : '';
          const cycleSlot = (!duty && cur) ? getCycleSlotForDate(date, cycleConfig) : null;
          return (
            <div key={date}
              className={`day-cell ${!cur?'other-month':''} ${date===todayStr?'today':''} ${weekend?'weekend':''}`}
              onClick={() => cur && onDayClick(date)}>
              <span className="day-number">{parseLocalDate(date).getDate()}</span>
              <div className="day-duties">
                {duty && (
                  <div className="duty-chip" style={{ '--chip-color': color }}>
                    <span className="chip-name">{type ? type.name : (duty.customName || 'Custom')}</span>
                    <span className="chip-time">{duty.startTime}–{duty.endTime}{overnightTag}</span>
                    {attrBits.length > 0 && <span className="chip-attrs">{attrBits.join(' · ')}</span>}
                  </div>
                )}
                {cycleSlot && !cycleSlot.isRest && (
                  <div className="cycle-chip">
                    <span className="cycle-chip-label">({cycleSlot.label})</span>
                    {cycleSlot.startTime && <span className="cycle-chip-time">{cycleSlot.startTime}–{cycleSlot.endTime}</span>}
                  </div>
                )}
              </div>
              {cur && !duty && !(cycleSlot && !cycleSlot.isRest) && <span className="day-add-hint">+</span>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ===== MAIN APP =====

function App() {
  const saved    = loadSettings();
  const today    = new Date();
  const todayStr = fmtDate(today);

  const initProfiles = (() => {
    if (saved?.profiles) return saved.profiles.map(p => ({ ...p, attributes: p.attributes || [] }));
    return DEFAULT_PROFILES;
  })();
  const initActiveId = saved?.activeProfileId || initProfiles[0]?.id || 'datcc';

  const [profiles,           setProfiles]           = useState(initProfiles);
  const [activeProfileId,    setActiveProfileId]    = useState(initActiveId);
  const [nightMode,          setNightMode]          = useState(saved?.nightMode || 'endDate');
  const [duties,             setDuties]             = useState([]);   // always loaded from GCal
  const [clientId,           setClientId]           = useState(saved?.clientId || '');
  const [selectedCalendarId, setSelectedCalendarId] = useState(saved?.selectedCalendarId || 'primary');
  const [cycleConfig,        setCycleConfig]        = useState(saved?.cycleConfig || null);
  const [calendars,          setCalendars]          = useState([]);
  const [curDate,            setCurDate]            = useState(today);
  const [modalDate,          setModalDate]          = useState(null);
  const [showCycle,          setShowCycle]          = useState(false);
  const [showSettings,       setShowSettings]       = useState(false);
  const [signedIn,           setSignedIn]           = useState(false);
  const [syncStatus,         setSyncStatus]         = useState(null);
  const [syncMsg,            setSyncMsg]            = useState('');
  const [apiReady,           setApiReady]           = useState(false);

  const tokenRef      = useRef(null);
  const pendingRef    = useRef(null);
  const calendarIdRef = useRef(selectedCalendarId);
  const tokenTimerRef = useRef(null);
  const dutiesRef     = useRef(duties);
  const nightModeRef  = useRef(nightMode);
  const profilesRef   = useRef(profiles);
  const activeIdRef   = useRef(activeProfileId);

  const year  = curDate.getFullYear();
  const month = curDate.getMonth();
  const isCurrentMonth = year === today.getFullYear() && month === today.getMonth();

  const activeProfile = profiles.find(p => p.id === activeProfileId) || profiles[0] || { dutyTypes:[], attributes:[] };
  const dutyTypes  = activeProfile.dutyTypes  || [];
  const attributes = activeProfile.attributes || [];

  useEffect(() => { dutiesRef.current    = duties;       }, [duties]);
  useEffect(() => { nightModeRef.current = nightMode;    }, [nightMode]);
  useEffect(() => { calendarIdRef.current = selectedCalendarId; }, [selectedCalendarId]);
  useEffect(() => { profilesRef.current  = profiles;    }, [profiles]);
  useEffect(() => { activeIdRef.current  = activeProfileId; }, [activeProfileId]);

  useEffect(() => {
    saveSettings({ profiles, activeProfileId, nightMode, clientId, selectedCalendarId, cycleConfig });
  }, [profiles, activeProfileId, nightMode, clientId, selectedCalendarId, cycleConfig]);

  const flashStatus = (status, msg, ms = 4000) => {
    setSyncStatus(status); setSyncMsg(msg);
    setTimeout(() => setSyncStatus(null), ms);
  };

  const doSignOut = message => {
    try { gapi.client.setToken(null); } catch {}
    localStorage.removeItem('atcsm_token');
    if (tokenTimerRef.current) { clearTimeout(tokenTimerRef.current); tokenTimerRef.current = null; }
    setSignedIn(false); setCalendars([]); setDuties([]);
    if (message) flashStatus('error', message);
  };

  const applyToken = (accessToken, expiry) => {
    gapi.client.setToken({ access_token: accessToken });
    if (tokenTimerRef.current) clearTimeout(tokenTimerRef.current);
    tokenTimerRef.current = setTimeout(() => doSignOut('Session expired — please sign in again.'), expiry - Date.now());
  };

  const getActiveAttrs = () => {
    const ap = profilesRef.current.find(p => p.id === activeIdRef.current) || profilesRef.current[0];
    return { dutyTypes: ap?.dutyTypes || [], attributes: ap?.attributes || [] };
  };

  const fetchCalendars = async () => {
    try {
      const resp = await gapi.client.request({ path: 'https://www.googleapis.com/calendar/v3/users/me/calendarList' });
      setCalendars((resp.result.items||[]).filter(c => c.accessRole==='owner' || c.accessRole==='writer'));
    } catch (err) { console.error('Failed to fetch calendars:', err); }
  };

  const doReconcile = async calId => {
    const { dutyTypes: dt, attributes: at } = getActiveAttrs();
    const reconciled = await reconcileCalendar(calId, dutiesRef.current, nightModeRef.current, dt, at);
    setDuties(reconciled);
  };

  // Init Google APIs
  useEffect(() => {
    if (!clientId) return;
    let cancelled = false;
    (async () => {
      try {
        await waitForGAPI();
        if (cancelled) return;
        await new Promise(resolve => gapi.load('client', resolve));
        await gapi.client.init({ discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest'] });

        tokenRef.current = google.accounts.oauth2.initTokenClient({
          client_id: clientId,
          scope: 'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/calendar.readonly',
          callback: async resp => {
            if (resp.error) { console.error('OAuth error', resp); return; }
            const expiry = Date.now() + (resp.expires_in - 60) * 1000;
            localStorage.setItem('atcsm_token', JSON.stringify({ access_token: resp.access_token, expiry }));
            applyToken(resp.access_token, expiry);
            setSignedIn(true);
            await fetchCalendars();
            await doReconcile(calendarIdRef.current);
            if (pendingRef.current) { pendingRef.current(); pendingRef.current = null; }
          },
        });

        if (!cancelled) {
          setApiReady(true);
          try {
            const tok = JSON.parse(localStorage.getItem('atcsm_token') || 'null');
            if (tok && tok.expiry > Date.now()) {
              applyToken(tok.access_token, tok.expiry);
              setSignedIn(true);
              await fetchCalendars();
              await doReconcile(calendarIdRef.current);
            } else { localStorage.removeItem('atcsm_token'); }
          } catch (e) { localStorage.removeItem('atcsm_token'); }
        }
      } catch (err) { console.error('Google API init failed:', err); }
    })();
    return () => { cancelled = true; };
  }, [clientId]);

  const ensureSignedIn = action => {
    const token = gapi.client.getToken?.();
    if (signedIn && token) { action(); return; }
    pendingRef.current = action;
    tokenRef.current?.requestAccessToken({ prompt: '' });
  };

  const saveDuty   = duty => setDuties(prev => { const i = prev.findIndex(d => d.id===duty.id); return i>=0 ? prev.map((d,j) => j===i?duty:d) : [...prev,duty]; });
  const deleteDuty = id   => setDuties(prev => prev.filter(d => d.id !== id));

  // ── SYNC ──
  const doSync = useCallback(async () => {
    const calId = calendarIdRef.current;
    const todayFmt = fmtDate(new Date());
    const pending = duties.filter(d => d.date >= todayFmt);
    if (pending.length === 0) { flashStatus('error', 'No upcoming duties to sync.'); return; }
    setSyncStatus('syncing'); setSyncMsg(`Syncing ${pending.length} duties…`);
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    let ok = 0, fail = 0;
    const updatedDuties = [...duties];

    for (const duty of pending) {
      try {
        // Remove cycle placeholder for this date (if any)
        const cycleSlotHere = getCycleSlotForDate(duty.date, cycleConfig);
        if (cycleSlotHere && !cycleSlotHere.isRest) {
          try {
            const dayEnd = fmtDate(addDays(parseLocalDate(duty.date), 1));
            // Search a window wide enough to catch overnight cycle events
            const searchMin = `${fmtDate(addDays(parseLocalDate(duty.date), -1))}T00:00:00Z`;
            const searchMax = `${dayEnd}T23:59:59Z`;
            const lr = await gapi.client.calendar.events.list({
              calendarId: calId, timeMin: searchMin, timeMax: searchMax,
              privateExtendedProperty: 'source=atcsm-cycle', singleEvents: true,
            });
            const title = `(${cycleSlotHere.label})`;
            for (const e of (lr.result.items||[]).filter(e => e.summary === title))
              await gapi.client.calendar.events.delete({ calendarId: calId, eventId: e.id });
          } catch (e) { console.warn('Could not remove cycle event:', e); }
        }

        const startDate = duty.overnight
          ? (nightMode==='startDate' ? duty.date : fmtDate(addDays(parseLocalDate(duty.date), -1)))
          : duty.date;
        const endDate = duty.overnight
          ? (nightMode==='startDate' ? fmtDate(addDays(parseLocalDate(duty.date), 1)) : duty.date)
          : duty.date;

        const event = {
          summary:     buildTitle(duty, dutyTypes, attributes),
          description: duty.notes || '',
          start: { dateTime: `${startDate}T${duty.startTime}:00`, timeZone: tz },
          end:   { dateTime: `${endDate}T${duty.endTime}:00`,     timeZone: tz },
          extendedProperties: { private: { source: 'atcsm' } },
        };

        let eventId = duty.googleEventId;
        if (eventId) {
          try { await gapi.client.calendar.events.update({ calendarId: calId, eventId, resource: event }); }
          catch (e) {
            if (e.status===404||e.status===410) { const r=await gapi.client.calendar.events.insert({ calendarId: calId, resource: event }); eventId=r.result.id; }
            else throw e;
          }
        } else {
          const r = await gapi.client.calendar.events.insert({ calendarId: calId, resource: event });
          eventId = r.result.id;
        }

        const idx = updatedDuties.findIndex(d => d.id===duty.id);
        if (idx>=0) updatedDuties[idx] = { ...updatedDuties[idx], googleEventId: eventId, synced: true };
        ok++;
      } catch (err) { console.error('Sync failed:', duty, err); fail++; }
    }

    setDuties(updatedDuties);
    flashStatus(fail?'error':'success', fail?`Synced ${ok}, failed ${fail}.`:`Synced ${ok} duties.`);
  }, [duties, dutyTypes, attributes, cycleConfig, nightMode]);

  const handleSignIn = () => {
    if (!clientId) { setShowSettings(true); return; }
    if (!apiReady) { flashStatus('error', 'Google API not ready yet.'); return; }
    tokenRef.current?.requestAccessToken({ prompt: '' });
  };

  const handleSync = () => {
    if (!clientId) { setShowSettings(true); return; }
    if (!signedIn) { flashStatus('error', 'Please sign in first.'); return; }
    doSync();
  };

  const handleGenerateCycle = async ({ startDate, startSlot }) => {
    const doGenerate = async () => {
      const calId = calendarIdRef.current;
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      setSyncStatus('syncing'); setSyncMsg('Creating recurring cycle events…');
      let created=0, fail=0;
      for (let i=0; i<CYCLE_LENGTH; i++) {
        const slot = CYCLE_SLOTS[i];
        if (slot.isRest) continue;
        // Offset from the reference date so slot i falls on startDate
        let offset = i - startSlot;
        if (offset < 0) offset += CYCLE_LENGTH;
        const firstDate = fmtDate(addDays(parseLocalDate(startDate), offset));
        const overnight = isOvernightTimes(slot.startTime, slot.endTime);
        const endDate   = overnight ? fmtDate(addDays(parseLocalDate(firstDate), 1)) : firstDate;
        try {
          await gapi.client.calendar.events.insert({ calendarId: calId, resource: {
            summary: `(${slot.label})`,
            start: { dateTime: `${firstDate}T${slot.startTime}:00`, timeZone: tz },
            end:   { dateTime: `${endDate}T${slot.endTime}:00`,     timeZone: tz },
            colorId: '8',   // graphite
            recurrence: ['RRULE:FREQ=DAILY;INTERVAL=9'],
            extendedProperties: { private: { source: 'atcsm-cycle' } },
          }});
          created++;
        } catch (err) { console.error(err); fail++; }
      }
      flashStatus(fail?'error':'success', fail?`Created ${created}, failed ${fail}.`:`Created ${created} recurring cycle events.`);
      setCycleConfig({ startDate, startSlot });
      setShowCycle(false);
    };
    if (!clientId) { setShowSettings(true); return; }
    ensureSignedIn(doGenerate);
  };

  const pendingDutyCount = duties.filter(d => d.date >= todayStr && !d.synced).length;
  const totalDutyCount   = duties.filter(d => d.date >= todayStr).length;
  const monthLabel = curDate.toLocaleDateString('en-GB', { month:'long', year:'numeric' }).toUpperCase();

  return (
    <div className="app" style={{ display:'flex', flexDirection:'column', height:'100%' }}>
      <header className="app-header">
        <div style={{ display:'flex', alignItems:'center', gap:'8px' }}>
          <span className="app-logo"><span className="accent">ATC</span> SHIFT MANAGER</span>
          <span style={{ fontFamily:'var(--font-mono)', fontSize:'10px', color:'var(--text-muted)', letterSpacing:'1px' }}>{APP_VERSION}</span>
        </div>

        <div className="header-center">
          <button className="nav-btn" onClick={() => setCurDate(new Date(year, month-1, 1))}>‹</button>
          <span className="month-label">{monthLabel}</span>
          <button className="nav-btn" onClick={() => setCurDate(new Date(year, month+1, 1))}>›</button>
          <button
            className={`nav-btn today-btn ${isCurrentMonth ? 'is-today' : ''}`}
            onClick={() => setCurDate(today)}
            title="Go to today">
            Today
          </button>
        </div>

        <div className="header-right">
          {syncStatus && <span className={`sync-status ${syncStatus}`}>{syncMsg}</span>}
          {signedIn && calendars.length > 0 && (
            <select className="cal-select" value={selectedCalendarId}
              onChange={async e => {
                const newId = e.target.value;
                setSelectedCalendarId(newId);
                setDuties(prev => prev.map(d => ({ ...d, synced:false, googleEventId:null })));
                setSyncStatus('syncing'); setSyncMsg('Loading calendar…');
                const { dutyTypes: dt, attributes: at } = getActiveAttrs();
                const reconciled = await reconcileCalendar(newId, dutiesRef.current, nightModeRef.current, dt, at);
                setDuties(reconciled);
                setSyncStatus(null);
              }}>
              {calendars.map(c => <option key={c.id} value={c.id}>{c.summary}</option>)}
            </select>
          )}
          <button className="btn-secondary" onClick={() => setShowCycle(true)}>↻ Cycle</button>
          {!signedIn
            ? <button className="btn-primary" onClick={handleSignIn}>Sign in</button>
            : pendingDutyCount===0
              ? <span className="btn-synced">✓ All synced</span>
              : <button className="btn-primary" onClick={handleSync} disabled={syncStatus==='syncing'}>
                  {syncStatus==='syncing' ? 'Syncing…' : `Sync (${pendingDutyCount}/${totalDutyCount})`}
                </button>
          }
          <button className="btn-icon-lg" onClick={() => setShowSettings(true)} title="Settings">⚙</button>
          {signedIn && <button className="btn-secondary btn-sm" onClick={() => doSignOut(null)}>Sign out</button>}
        </div>
      </header>

      <main className="app-main">
        {!clientId && (
          <div className="setup-banner">
            <span>⚠ Google Client ID not configured — sync is disabled.</span>
            <button className="btn-primary btn-sm" onClick={() => setShowSettings(true)}>Open Settings</button>
          </div>
        )}
        {clientId && !signedIn && (
          <div className="setup-banner setup-banner-login">
            <span>Sign in to load your roster from Google Calendar.</span>
            <button className="btn-primary btn-sm" onClick={handleSignIn}>Sign in with Google</button>
          </div>
        )}
        <CalendarGrid year={year} month={month} duties={duties} dutyTypes={dutyTypes}
          attributes={attributes} cycleConfig={cycleConfig} nightMode={nightMode}
          todayStr={todayStr} onDayClick={setModalDate} />
      </main>

      {modalDate && (
        <DutyModal date={modalDate}
          existingDuty={duties.find(d => d.date===modalDate) || null}
          dutyTypes={dutyTypes} attributes={attributes}
          onSave={saveDuty} onDelete={deleteDuty}
          onClose={() => setModalDate(null)} />
      )}

      {showCycle && <CycleModal onGenerate={handleGenerateCycle} onClose={() => setShowCycle(false)} />}

      {showSettings && (
        <SettingsModal profiles={profiles} activeProfileId={activeProfileId}
          nightMode={nightMode} clientId={clientId}
          onSave={({ profiles: p, activeProfileId: aid, nightMode: nm, clientId: cid }) => {
            setProfiles(p); setActiveProfileId(aid); setNightMode(nm); setClientId(cid);
            setShowSettings(false);
          }}
          onClose={() => setShowSettings(false)} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
